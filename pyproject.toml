[project]
name = "keria"
version = "0.4.1"
description = "KERIA: KERI Agent in the cloud"
readme = "README.md"
license = { text = "Apache Software License 2.0" }
authors = [
    { name = "Philip S. Feairheller", email = "pfeairheller@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
keywords = [
    "secure attribution",
    "authentic data",
    "discovery",
    "resolver"
]
requires-python = ">=3.12.2"
dependencies = [
    "hio @ git+https://github.com/provenant-dev/hio.git@v0.6.14-fix1",
    "keri @ git+https://github.com/provenant-dev/keripy.git@v1.2.14-pr1",
    "mnemonic==0.21",
    "multicommand==1.0.0",
    "falcon==4.4.0",
    "http_sfv==0.9.9",
    "dataclasses_json==0.6.7",
    "apispec==6.10.0",
    "marshmallow_dataclass==8.7.1",
    "deprecation==2.1.0",
    "lmdb==1.8.1",
]

[project.scripts]
keria = "keria.app.cli.keria:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    # Held below 0.16, which broadened the default rule set (adds isort etc.) and
    # reports 749 findings here. Needs an explicit [tool.ruff] config to move up.
    "ruff==0.15.22",
    # Held below 9.1, which surfaces a TypeError from TruncatedFormatter mutating
    # LogRecord.lineno into a str (see src/keria/monitoring/logs.py).
    "pytest==9.0.3",
    "coverage==7.17.0",
    "pytest-cov==7.1.0",
    "requests==2.34.2",
    # Newest sphinx compatible with requires-python >=3.12.2; 9.2.0 needs >=3.13.
    "sphinx==9.1.1",
    "sphinx-rtd-theme==3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"
